name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen --group dev --extra server --extra ws

      - name: Verify import
        run: uv run --frozen python -c "from qmt_bridge import QMTClient; print('import OK')"

      - name: Check critical Python diagnostics
        run: uv run --frozen ruff check src tests

      - name: Check typed contract modules
        run: uv run --frozen basedpyright

      - name: Check Big QMT embedded Python 3.6 syntax
        run: uv run --frozen python scripts/check-embedded-py36.py

      - name: Run tests
        run: uv run --frozen python -m pytest tests/ -v
        if: hashFiles('tests/') != ''

      - name: Build distributions
        run: uv run --frozen python -m build

      - name: Verify wheel and sdist install with embedded assets
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          archives = sorted(Path("dist").glob("qmt_bridge-*"))
          assert len(archives) == 2, archives
          for archive in archives:
              with tempfile.TemporaryDirectory() as temp:
                  env = Path(temp) / "venv"
                  venv.EnvBuilder(with_pip=True).create(env)
                  python = env / "bin" / "python"
                  subprocess.run([str(python), "-m", "pip", "install", str(archive)], check=True)
                  probe = (
                      "from qmt_bridge.install_runtime import resolve_asset_root\n"
                      "root = resolve_asset_root(None)\n"
                      "required = [\n"
                      "  root / 'src' / 'BIGQMT_REDIS_DRYRUN.py',\n"
                      "  root / 'src' / 'MECOSTOCK_BIGQMT_ZMQ.py',\n"
                      "  root / 'src' / 'mecostock_bigqmt_mode_overlay.py',\n"
                      "  root / 'third_party' / 'xtquant_big_convert.UPSTREAM.json',\n"
                      "]\n"
                      "assert all(path.is_file() for path in required), required\n"
                  )
                  subprocess.run([str(python), "-c", probe], check=True)
          PY
