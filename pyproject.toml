[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qmt-bridge"
dynamic = ["version"]
description = "HTTP/WebSocket bridge for Big QMT ZMQ market data and guarded account APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "QMT Bridge Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

# Base install has zero dependencies (client-only, stdlib)
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pandas>=1.5",
    "numpy>=1.23",
    "pyzmq>=25.0.0",
]
pandas = ["pandas>=1.5"]
ws = ["websockets>=11.0"]
client = ["websockets>=11.0"]
notify = ["httpx>=0.25"]
full = [
    "qmt-bridge[server,ws,notify]",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "pdoc>=14.0",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=1.5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "build>=1.3.0",
    "httpx2>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.15.0",
]

[project.scripts]
qmt-server = "qmt_bridge.server.cli:main"
qmt-install-runtime = "qmt_bridge.install_runtime:main"

[project.urls]
Homepage = "https://github.com/atompilot/qmt-bridge"
Repository = "https://github.com/atompilot/qmt-bridge"

[tool.hatch.version]
path = "src/qmt_bridge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qmt_bridge", "src/bigqmt_signal_trader"]

[tool.hatch.build.targets.wheel.force-include]
"src/BIGQMT_REDIS_DRYRUN.py" = "qmt_bridge/_runtime_assets/src/BIGQMT_REDIS_DRYRUN.py"
"src/MECOSTOCK_BIGQMT_ZMQ.py" = "qmt_bridge/_runtime_assets/src/MECOSTOCK_BIGQMT_ZMQ.py"
"src/mecostock_bigqmt_mode_overlay.py" = "qmt_bridge/_runtime_assets/src/mecostock_bigqmt_mode_overlay.py"
"src/bigqmt_signal_trader_strategy.py" = "qmt_bridge/_runtime_assets/src/bigqmt_signal_trader_strategy.py"
"src/bigqmt_signal_trader_redis_rpc_runtime.py" = "qmt_bridge/_runtime_assets/src/bigqmt_signal_trader_redis_rpc_runtime.py"
"src/bigqmt_signal_trader" = "qmt_bridge/_runtime_assets/src/bigqmt_signal_trader"
"third_party/xtquant_big_convert.UPSTREAM.json" = "qmt_bridge/_runtime_assets/third_party/xtquant_big_convert.UPSTREAM.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/qmt_bridge",
    "src/bigqmt_signal_trader",
    "src/bigqmt_signal_trader_strategy.py",
    "src/bigqmt_signal_trader_redis_rpc_runtime.py",
    "src/BIGQMT_REDIS_DRYRUN.py",
    "src/MECOSTOCK_BIGQMT_ZMQ.py",
    "src/mecostock_bigqmt_mode_overlay.py",
    "third_party/xtquant_big_convert.UPSTREAM.json",
    "scripts/install-bigqmt-runtime.ps1",
    "scripts/manage-bridge.ps1",
    "scripts/start.bat",
    "scripts/start-nohup.bat",
    "scripts/stop.bat",
    "scripts/check-embedded-py36.py",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.basedpyright]
pythonVersion = "3.10"
include = ["src/qmt_bridge/server/capabilities.py", "src/qmt_bridge/server/events.py"]
typeCheckingMode = "strict"
